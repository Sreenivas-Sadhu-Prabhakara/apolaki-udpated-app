# ============================================================================
# Cloud Build — Apolaki Frontend (Vue.js SPA)
# Builds frontend → deploys to Firebase Hosting
# ============================================================================

steps:
  # Step 1: Install dependencies
  - name: 'node:18-alpine'
    id: 'install-frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd frontend && npm ci'

  # Step 2: Build production bundle
  - name: 'node:18-alpine'
    id: 'build-frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd frontend && npm run build'
    env:
      - 'VITE_APP_ENV=production'
      - 'VITE_APP_NAME=Apolaki'

  # Step 3: Deploy to Firebase Hosting
  - name: 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/firebase-deployer'
    id: 'deploy-firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install firebase-tools if not in custom image
        npm install -g firebase-tools 2>/dev/null || true
        firebase deploy --only hosting --project=$PROJECT_ID --non-interactive
    secretEnv: ['FIREBASE_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
      env: 'FIREBASE_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'

tags:
  - 'frontend'
  - 'firebase'
  - 'apolaki'
