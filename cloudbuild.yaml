# ============================================================================
# Cloud Build — Apolaki DB Service (Node.js Backend)
# Triggered on push to main or manually
# Builds Docker image → pushes to Artifact Registry → deploys to Cloud Run
# ============================================================================

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-db-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service:latest'
      - '-f'
      - 'middleware/netlify-db-service/Dockerfile'
      - 'middleware/netlify-db-service/'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-db-service'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-db-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'apolaki-db-service'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service:$SHORT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,APP_ENV=production'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,WEATHER_API_KEY=WEATHER_API_KEY:latest,GOOGLE_SOLAR_API_KEY=GOOGLE_SOLAR_API_KEY:latest,NREL_API_KEY=NREL_API_KEY:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/db-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '600s'

tags:
  - 'db-service'
  - 'backend'
  - 'apolaki'
