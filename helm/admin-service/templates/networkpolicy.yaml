apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apolaki-admin-service-internal-only
spec:
  podSelector:
    matchLabels:
      app: apolaki-admin-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              apolaki.io/internal-gateway: "true"
      ports:
        - protocol: TCP
          port: 3002
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
