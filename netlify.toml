# Apolaki Solar Platform - Netlify Deployment Configuration
# Combines frontend (Vue.js static site) with backend (Node.js serverless functions)
#
# Environment Variables Required:
#   - NETLIFY_DATABASE_URL (Neon PostgreSQL)
#   - JWT_SECRET (production)
#   - NODE_ENV (set to 'production')
#
# Setup:
#   1. netlify link (connect to your Netlify site)
#   2. netlify env:set KEY VALUE (set variables)
#   3. netlify deploy

[build]
  base = "."
  command = "npm ci --legacy-peer-deps && npm ci --include=dev --prefix frontend --legacy-peer-deps && npm ci --prefix middleware/netlify-db-service --legacy-peer-deps && npm run build --prefix frontend && npm run build --prefix middleware/netlify-db-service"
  publish = "frontend/dist"
  node_version = "20.x"
  functions = "middleware/netlify-db-service/.netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

# ============================================================================
# Functions configuration
# ============================================================================
[functions]
  node_bundler = "nft"
  included_files = [
    "config/**",
    "middleware/netlify-db-service/src/**",
    "middleware/netlify-db-service/package.json"
  ]

# ============================================================================
# Redirects
# ============================================================================
[[redirects]]
  # All API requests (including /api/admin/*) go to the single handler function
  from = "/api/*"
  to = "/.netlify/functions/handler/:splat"
  status = 200
  force = true

[[redirects]]
  # SPA fallback — must be last
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================================
# Headers
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # HSTS - require HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    # API specific headers
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/static/*"
  [headers.values]
    # Cache static assets
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================================
# Context-specific overrides
# ============================================================================
[context.production]
  command = "npm ci --legacy-peer-deps && npm ci --include=dev --prefix frontend --legacy-peer-deps && npm ci --prefix middleware/netlify-db-service --legacy-peer-deps && npm run build --prefix frontend && npm run build --prefix middleware/netlify-db-service"
  [context.production.environment]
    NODE_ENV = "production"
    NODE_VERSION = "20"

[context.staging]
  command = "npm ci --legacy-peer-deps && npm ci --include=dev --prefix frontend --legacy-peer-deps && npm ci --prefix middleware/netlify-db-service --legacy-peer-deps && npm run build --prefix frontend && npm run build --prefix middleware/netlify-db-service"
  [context.staging.environment]
    NODE_ENV = "staging"
    NODE_VERSION = "20"

[context.deploy-preview]
  command = "npm ci --legacy-peer-deps && npm ci --include=dev --prefix frontend --legacy-peer-deps && npm ci --prefix middleware/netlify-db-service --legacy-peer-deps && npm run build --prefix frontend && npm run build --prefix middleware/netlify-db-service"
  [context.deploy-preview.environment]
    NODE_ENV = "development"
    NODE_VERSION = "20"

[context.branch-deploy]
  command = "npm ci --legacy-peer-deps && npm ci --include=dev --prefix frontend --legacy-peer-deps && npm ci --prefix middleware/netlify-db-service --legacy-peer-deps && npm run build --prefix frontend && npm run build --prefix middleware/netlify-db-service"
  [context.branch-deploy.environment]
    NODE_ENV = "development"
    NODE_VERSION = "20"
