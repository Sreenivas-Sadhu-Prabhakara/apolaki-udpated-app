version: '3.8'

services:
  # PostgreSQL Database - Production-grade SQL database
  postgres:
    image: postgres:15-alpine
    container_name: apolaki-postgres
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      POSTGRES_USER: apolaki_user
      POSTGRES_PASSWORD: apolaki_pass
      POSTGRES_DB: apolaki_db
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apolaki_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apolaki-network

  # Redis Cache - In-memory data store for caching & sessions
  redis:
    image: redis:7-alpine
    container_name: apolaki-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apolaki-network

  # Main Business API - Primary data service
  netlify-db-service:
    build:
      context: ../middleware/netlify-db-service
      dockerfile: Dockerfile
    container_name: apolaki-db-service
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - apolaki-network

  # Admin Control Plane - internal-only governance API
  admin-service:
    build:
      context: ../middleware/admin-service
      dockerfile: Dockerfile
    container_name: apolaki-admin-service
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://apolaki_admin_rw:apolaki_pass@postgres:5432/apolaki_db
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apolaki-network

  # RabbitMQ Message Broker - Async task queue & messaging
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: apolaki-rabbitmq
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apolaki-network

  # Marketplace Microservice - Independent marketplace domain
  marketplace-service:
    build:
      context: ../middleware/marketplace-service
      dockerfile: Dockerfile
    container_name: apolaki-marketplace-service
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://apolaki_app_rw:apolaki_pass@postgres:5432/apolaki_db
      RABBITMQ_URL: amqp://apolaki:apolaki_pass@rabbitmq:5672/apolaki
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - apolaki-network

  # Elasticsearch (optional, for search & analytics)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: apolaki-elasticsearch
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apolaki-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  apolaki-network:
    driver: bridge
