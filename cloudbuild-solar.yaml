# ============================================================================
# Cloud Build — Apolaki Solar Service (Go)
# Builds Docker image → pushes to Artifact Registry → deploys to Cloud Run
# ============================================================================

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-solar-service'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service:latest'
      - '-f'
      - 'middleware/solar-service/Dockerfile'
      - 'middleware/solar-service/'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-solar-service'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-solar-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'apolaki-solar-service'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service:$SHORT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '128Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'APP_ENV=production'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apolaki-repo/solar-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'

tags:
  - 'solar-service'
  - 'golang'
  - 'apolaki'
